name: "publish"

on:
  push:
    branches:
      - release

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ""
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04" # for RISC-V support
            args: "--target riscv64gc-unknown-linux-gnu"
            target: "riscv64gc-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # change this to the version you want to use.

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Add RISC-V target to the targets list
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.target == 'riscv64gc-unknown-linux-gnu' && 'riscv64gc-unknown-linux-gnu' || '') }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf alsa-utils libasound2-dev openssl pkg-config libssl-dev
          # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.

          # Set OpenSSL environment variables for Linux build
          echo "OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> $GITHUB_ENV

      - name: install RISC-V cross-compilation tools
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross libssl-dev

          # Create proper OpenSSL directory structure for RISC-V
          sudo mkdir -p /usr/riscv64-linux-gnu/usr/include/openssl/
          sudo mkdir -p /usr/riscv64-linux-gnu/lib/
          sudo mkdir -p /usr/riscv64-linux-gnu/lib/pkgconfig/

          # Copy all OpenSSL headers
          sudo cp -r /usr/include/openssl/* /usr/riscv64-linux-gnu/usr/include/openssl/

          # Copy OpenSSL libraries
          sudo cp /usr/lib/x86_64-linux-gnu/libssl.so /usr/riscv64-linux-gnu/lib/
          sudo cp /usr/lib/x86_64-linux-gnu/libcrypto.so /usr/riscv64-linux-gnu/lib/

          # Create symbolic links
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libssl.so /usr/riscv64-linux-gnu/lib/libssl.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libcrypto.so /usr/riscv64-linux-gnu/lib/libcrypto.so

          # Create OpenSSL pkg-config files for RISC-V
          cat << EOF | sudo tee /usr/riscv64-linux-gnu/lib/pkgconfig/openssl.pc
          prefix=/usr/riscv64-linux-gnu
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/usr/include

          Name: OpenSSL
          Description: Secure Sockets Layer and cryptography libraries
          Version: 1.1.1
          Requires: libssl libcrypto
          EOF

          cat << EOF | sudo tee /usr/riscv64-linux-gnu/lib/pkgconfig/libssl.pc
          prefix=/usr/riscv64-linux-gnu
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/usr/include

          Name: OpenSSL-libssl
          Description: Secure Sockets Layer library
          Version: 1.1.1
          Requires.private: libcrypto
          Libs: -L\${libdir} -lssl
          Cflags: -I\${includedir}
          EOF

          cat << EOF | sudo tee /usr/riscv64-linux-gnu/lib/pkgconfig/libcrypto.pc
          prefix=/usr/riscv64-linux-gnu
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/usr/include

          Name: OpenSSL-libcrypto
          Description: OpenSSL cryptography library
          Version: 1.1.1
          Libs: -L\${libdir} -lcrypto
          Cflags: -I\${includedir}
          EOF

          # Set up pkg-config for cross-compilation
          echo "PKG_CONFIG_PATH=/usr/riscv64-linux-gnu/lib/pkgconfig:/usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/riscv64-linux-gnu" >> $GITHUB_ENV

          # Set OpenSSL environment variables
          echo "OPENSSL_DIR=/usr/riscv64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/riscv64-linux-gnu/usr/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=/usr/riscv64-linux-gnu/lib" >> $GITHUB_ENV

      - name: Generate build number
        id: buildnumber
        run: echo "build_number=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Generate Changelog
        run: echo "Auto Release" > ${{ github.workspace }}-CHANGELOG.txt

      - name: install frontend dependencies
        run: pnpm install --no-frozen-lockfile # allow updating the lockfile when package.json has changed

      - name: Setup Windows build environment
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SQLite environment variables for Windows
          SQLITE3_LIB_DIR: ${{ env.SQLITE3_LIB_DIR }}
          LIBSQLITE3_LINK_LIB: ${{ env.LIBSQLITE3_LINK_LIB }}
        run: |
          echo "LIBSQLITE3_LINK_LIB=sqlite3" >> $env:GITHUB_ENV
          echo "VCPKGRS_DYNAMIC=1" >> $env:GITHUB_ENV
          echo "ORT_STRATEGY=system" >> $env:GITHUB_ENV
          echo "ESAXX_USE_SYSTEM_LIBS=1" >> $env:GITHUB_ENV
          echo "CFLAGS=/MD" >> $env:GITHUB_ENV
          echo "CXXFLAGS=/MD" >> $env:GITHUB_ENV

      # Use custom build script for Windows
      - name: Build Windows with custom script
        if: matrix.platform == 'windows-latest'
        run: |
          # Create a patch for esaxx-rs to use dynamic runtime
          mkdir -p patches\esaxx-rs
          @"
          diff --git a/build.rs b/build.rs
          index abcdefg..hijklmn 100644
          --- a/build.rs
          +++ b/build.rs
          @@ -10,6 +10,10 @@ fn main() {
               let mut build = cc::Build::new();
               build.cpp(true);

          +    #[cfg(target_os = "windows")]
          +    build.flag_if_supported("/MD")
          +         .static_crt(false);
          +
               // Add the source files
               build.file("esaxx/esa.cpp");
               build.file("esaxx/sais.cpp");
          "@ | Out-File -Encoding utf8 patches\esaxx-rs\build.rs.patch

          # Set environment variables
          $env:VCPKGRS_DYNAMIC = "1"
          $env:ORT_STRATEGY = "system"
          $env:ESAXX_USE_SYSTEM_LIBS = "1"
          $env:CFLAGS = "/MD"
          $env:CXXFLAGS = "/MD"
          $env:RUSTFLAGS = "-C target-feature=-crt-static"

          # Run the build
          cd src-tauri
          cargo build --release
          cd ..
          pnpm build

          # Package the application
          pnpm tauri build

      # Use tauri-action for non-Windows platforms
      - uses: tauri-apps/tauri-action@v0
        if: matrix.platform != 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER for RISC-V cross-compilation
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'riscv64gc-unknown-linux-gnu' && 'riscv64-linux-gnu-gcc' || '' }}
          # Configure pkg-config for cross-compilation
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.target == 'riscv64gc-unknown-linux-gnu' && 'true' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.target == 'riscv64gc-unknown-linux-gnu' && '/usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig' || '' }}
          PKG_CONFIG_SYSROOT_DIR: ${{ matrix.target == 'riscv64gc-unknown-linux-gnu' && '/usr/riscv64-linux-gnu' || '' }}
          # OpenSSL configuration for all platforms
          OPENSSL_DIR: ${{ matrix.target == 'riscv64gc-unknown-linux-gnu' && '/usr/riscv64-linux-gnu' || (matrix.platform == 'ubuntu-22.04' && '/usr' || '') }}
          OPENSSL_INCLUDE_DIR: ${{ matrix.target == 'riscv64gc-unknown-linux-gnu' && '/usr/riscv64-linux-gnu/usr/include' || (matrix.platform == 'ubuntu-22.04' && '/usr/include' || '') }}
          OPENSSL_LIB_DIR: ${{ matrix.target == 'riscv64gc-unknown-linux-gnu' && '/usr/riscv64-linux-gnu/lib' || (matrix.platform == 'ubuntu-22.04' && '/usr/lib/x86_64-linux-gnu' || '') }}
          # Additional environment variables for RISC-V OpenSSL
          OPENSSL_STATIC: ${{ matrix.target == 'riscv64gc-unknown-linux-gnu' && 'true' || '' }}
        with:
          tagName: app-v__VERSION__-beta.${{ steps.buildnumber.outputs.build_number }} # 添加beta标签和构建号
          releaseName: "App v__VERSION__ Beta (${{ steps.buildnumber.outputs.build_number }})" # 标题包含Beta
          releaseBody: "这是一个Beta版本发布。请下载对应平台的安装包进行测试。"
          releaseDraft: false
          prerelease: true # 设置为预发布版本
          args: ${{ matrix.args }}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          repository: Horldsence/chat_box_rust
          # note you'll typically need to create a personal access token
          # with permissions to create releases in the other repo
          token: ${{ secrets.GITHUB_TOKEN }}
