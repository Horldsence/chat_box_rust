            /* Prevent text selection in desktop app */
            * {

            }

            /* Allow text selection in input/textarea */
            input,

                -ms-user-select: text;
                user-select: text;
            }

            /* Loading screen */
            .loading-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                transition: opacity 0.3s ease-in-out;
            }

            .loading-content {
                text-align: center;
                color: white;
            }

            .loading-spinner {
                width: 50px;
                height: 50px;
                border: 4px solid rgba(255, 255, 255, 0.3);
                border-top: 4px solid white;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin: 0 auto 20px;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            .loading-text {
                font-size: 18px;

                margin-top: 16px;
            }

            /* Hide loading screen when app is ready */
            .app-ready .loading-screen {
                opacity: 0;
                pointer-events: none;
            }

            /* Error styles */

                position: fixed;
                top: 0;
                left: 0;
                width: 100%;

			<script>
				{

						base: new URL(".", location).pathname.slice(0, -1)
					};

					const element = document.currentScript.parentElement;

					Promise.all([

			</script>

        <!-- Error Boundary -->
        <div class="error-boundary" id="error-boundary" style="display: none">
            <div class="error-content">
                <div class="error-icon">⚠️</div>
                <div class="error-title">应用启动失败</div>
                <div class="error-message">
                    Chat Box 遇到了一个意外错误。请尝试重新启动应用。
                </div>
                <button class="error-button" onclick="window.location.reload()">
                    重新加载
                </button>
            </div>
        </div>

        <!-- App Ready Script -->
        <script>
            // Remove loading screen when app is ready
            document.addEventListener("DOMContentLoaded", function () {
                setTimeout(() => {
                    document.body.classList.add("app-ready");
                    setTimeout(() => {
                        const loadingScreen =
                            document.getElementById("loading-screen");
                        if (loadingScreen) {
                            loadingScreen.remove();
                        }
                    }, 300);
                }, 1000);
            });

            // Global error handler
            window.addEventListener("error", function (event) {
                console.error("Global error:", event.error);
                const errorBoundary = document.getElementById("error-boundary");
                const loadingScreen = document.getElementById("loading-screen");

                if (errorBoundary) {
                    errorBoundary.style.display = "flex";
                }
                if (loadingScreen) {
                    loadingScreen.style.display = "none";
                }
            });

            // Unhandled promise rejection handler
            window.addEventListener("unhandledrejection", function (event) {
                console.error("Unhandled promise rejection:", event.reason);
                // Optionally show error boundary for critical errors
            });

            // Prevent default drag and drop behavior
            document.addEventListener("dragover", function (e) {
                e.preventDefault();
            });

            document.addEventListener("drop", function (e) {
                e.preventDefault();
            });

            // Prevent context menu (right-click) in production
            if (window.__TAURI__ && !window.__TAURI_DEBUG__) {
                document.addEventListener("contextmenu", function (e) {
                    e.preventDefault();
                });
            }

            // Handle theme changes
            function updateTheme() {
                const theme = localStorage.getItem("theme") || "auto";
                if (theme === "auto") {
                    const prefersDark = window.matchMedia(
                        "(prefers-color-scheme: dark)",
                    ).matches;
                    document.documentElement.setAttribute(
                        "data-theme",
                        prefersDark ? "dark" : "light",
                    );
                } else {
                    document.documentElement.setAttribute("data-theme", theme);
                }
            }

            // Initialize theme
            updateTheme();

            // Listen for system theme changes
            window
                .matchMedia("(prefers-color-scheme: dark)")
                .addEventListener("change", updateTheme);
        </script>
