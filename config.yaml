config_path: config.yaml
ai_model:
  model_type: "ollama" # "ollama" or "candle"
  model_name: "qwen2.5:0.5b"
  server_url: "http://localhost"
  server_port: 11434
  system_prompt: "你是一个友好、乐于助人的AI助手，使用中文回答问题。"
  # Candle specific settings (used when model_type is "candle")
  candle_model_id: "microsoft/DialoGPT-medium"
  candle_revision: "main"
  candle_use_flash_attn: false
voice:
  enabled: false
  model_path: model/vosk-model-small-cn-0.22
  timeout_seconds: 15
ui:
  theme: light
  language: zh-CN
database:
  enabled: true
  path: database/chat_database.db
app_behavior:
  log_level: "info"
  default_conversation_title: "新对话"
  welcome_message: "欢迎使用聊天应用!"
  message_chunk_buffer_size: 2
  message_chunk_send_interval_ms: 3
  show_error_dialogs: true # 是否在初始化错误时显示对话框
  auto_retry_failed_init: false # 是否自动重试失败的初始化
