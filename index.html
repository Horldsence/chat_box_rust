<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/tauri.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chat Box - 智能聊天助手</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100vh;
                overflow: hidden;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Oxygen, Ubuntu, Cantarell, sans-serif;
            }

            #app {
                height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .loading {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                font-size: 18px;
            }

            .loading::before {
                content: "";
                width: 20px;
                height: 20px;
                border: 2px solid rgba(255, 255, 255, 0.3);
                border-top: 2px solid white;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin-right: 10px;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

    <body>
        <div id="app">
            <div class="loading">正在加载应用...</div>
        </div>
        <script type="module" src="/src/pages/main/main.ts"></script>
    </body>
</html>
