[workspace]
members = [
    "crates/agent",
    "crates/asr",
    "crates/calendar",
    "crates/cb_config",
    "crates/db",
    "crates/extensions",
    "crates/file_finder",
    "crates/file_vec",
    "crates/initialize",
    "crates/live2d",
    "crates/tts-local",
    "crates/file_vec", "crates/kb_manager",
]

[package]
name = "chat_box"
version = "0.1.0"
description = "A ai chat application build with rust and tauri"
license = "MIT"
authors = ["pengheng"]
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chat_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }
log = "0.4.27"
env_logger = "0.11.8"

[features]
default = ["candle"]
asr = ["dep:asr", "pyo3"]
full = ["tts", "candle", "reqwest", "asr"]
reqwest = []
candle = ["agent/candle"]
tts = ["dep:tts-local", "tts-local/kokoro-tts"]

[dependencies]
serde_yaml = "0.9.34-deprecated"
termcolor = "1.4.1"
tauri = { version = "2.5.1", features = [] }
tauri-plugin-opener = "2.2.7"
async-trait = "0.1.88"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = "0.4.41"
async-stream = "0.3.6"
log = "0.4.27"
futures = "0.3.31"
ollama-rs = { version = "0.3.1", features = ["stream"] }
tokio = { version = "1.45.1", features = ["full"] }
tokio-stream = "0.1.17"
smol = "2.0.2"
pyo3 = { version = "0.25.0", features = [
    "auto-initialize",
    "full",
], optional = true }
rodio = "0.20.1"
config = "0.15.11"
anyhow = "1.0.98"
toml = "0.8.22"
once_cell = "1.21.3"
vosk = "0.3.1"
cpal = "0.15.3"
num-traits = "0.2.19"
rusqlite = { version = "0.36.0", features = ["bundled"] }
scopeguard = "1.2.0"
tauri-plugin-dialog = "2.2.2"
uuid = { version = "1.0", features = ["v4"] }
candle-core = { git = "https://github.com/Horldsence/candle_eswin.git", version = "0.9.1" }
candle-transformers = { git = "https://github.com/Horldsence/candle_eswin.git", version = "0.9.1" }
candle-nn = { git = "https://github.com/Horldsence/candle_eswin.git", version = "0.9.1" }
candle-examples = { git = "https://github.com/Horldsence/candle_eswin.git", version = "0.9.1" }
hf-hub = "0.4.2"
tokenizers = "0.21.1"
clap = { version = "4.5.39", features = ["derive", "suggestions"] }
tracing-subscriber = "0.3.19"
tracing-chrome = "0.7.2"
agent = { path = "crates/agent" }
initialize = { path = "crates/initialize" }
tauri-plugin-log = "2"
live2d = { path = "crates/live2d" }
db = { path = "crates/db" }
tts-local = { path = "crates/tts-local", optional = true }
cb_config = { path = "crates/cb_config" }
asr = { path = "crates/asr", optional = true }
file_finder = { path = "crates/file_finder" }
tauri-plugin-fs = "2"
file_vec = { path = "crates/file_vec" }
