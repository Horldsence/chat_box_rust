[package]
name = "agent"
version = "0.1.0"
edition = "2021"
description = "AI agent implementation crate for Chat Box Rust"
authors = ["Horldsence <m18511047688@163.com>"]
license = "MIT"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
env_logger = "0.11.8"
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["full"] }
tokio-stream = "0.1.17"
ollama-rs = { version = "0.3.1", features = ["stream"] }
async-trait = "0.1.88"
reqwest = { version = "0.12.20", features = ["json"] }
thiserror = "2.0.12"
log = "0.4.27"
chrono = { version = "0.4.41", features = ["serde"] }
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
rodio = "0.20.1"
tracing-subscriber = { version = "0.3.18", features = ["fmt", "env-filter"] }
tokenizers = { version = "0.21.1" }
hf-hub = { version = "0.4.2" }
tracing-chrome = "0.7.2"
candle-core = { git = "https://github.com/Horldsence/candle_eswin.git", version = "0.9.1" }
candle-transformers = { git = "https://github.com/Horldsence/candle_eswin.git", version = "0.9.1" }
candle-nn = { git = "https://github.com/Horldsence/candle_eswin.git", version = "0.9.1" }
candle-examples = { git = "https://github.com/Horldsence/candle_eswin.git", version = "0.9.1" }

[features]
default = []
candle = []                # 启用本地模型支持
ollama = []                # Ollama 集成
all = ["candle", "ollama"]

[dev-dependencies]
# 测试工具
tokio-test = "0.4.4"
mockito = "1.7.0"
