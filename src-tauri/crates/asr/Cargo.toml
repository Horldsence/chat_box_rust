[package]
name = "asr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
april_asr = "0.1.31"
base64 = "0.22.1"
cpal = "0.16.0"
env_logger = "0.11.0"
futures = "0.3.31"
log = "0.4.27"
num-traits = "0.2.19"
pyo3 = "0.25.1"
rand = "0.8.5"
reqwest = { version = "0.12.0", features = ["json"] }
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
tokio = { version = "1.46.1", features = ["full"] }
tokio-stream = "0.1.17"
vosk = "0.3.1"

[[example]]
name = "baidu_asr_example"
path = "examples/baidu_asr_example.rs"
