[package]
name = "file_finder"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45.1", features = ["full"] }
regex = "1.10"
dirs = "5.0"
walkdir = "2.4"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
async-trait = "0.1"
rayon = "1.8"
ignore = "0.4"
tauri-plugin-fs = "2"
tempfile = "3.0"
env_logger = "0.11"
