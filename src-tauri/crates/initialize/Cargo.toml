[package]
name = "initialize"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34-deprecated"
serde_json = "1.0.140"
chrono = "0.4.41"
log = "0.4.27"
tokio = { version = "1.45.1", features = ["full"] }
anyhow = "1.0.98"
tauri = { version = "2.5.1", features = [] }
tauri-plugin-dialog = "2.2.2"

# Candle dependencies for local model support
candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.9.1" }
candle-transformers = { git = "https://github.com/huggingface/candle.git", version = "0.9.1" }
candle-nn = { git = "https://github.com/huggingface/candle.git", version = "0.9.1" }
hf-hub = "0.4.2"
tokenizers = "0.21.1"

# Ollama client for checking availability
ollama-rs = { version = "0.3.1", features = ["stream"] }

# Voice processing
vosk = { version = "0.3.1", optional = true }

# Database
rusqlite = { version = "0.36.0", features = ["bundled"] }

# Utilities
once_cell = "1.21.3"
futures = "0.3.31"

cb_config = { path = "../cb_config" }
utc = "0.2.0"

[dev-dependencies]
tempfile = "3.8.1"
tokio-test = "0.4.3"

[features]
default = []
test-integration = []
